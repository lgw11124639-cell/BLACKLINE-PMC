<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a20"><title>BLACKLINE PMC</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e9f0ee;background:#0c1318}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#111b21eF;backdrop-filter:blur(12px);z-index:5;padding:15px 16px;border-bottom:1px solid #304047}header b{letter-spacing:2px}header small{display:block;color:#94a9ad;margin-top:3px}main{max-width:700px;margin:auto;padding:18px 15px 105px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card{background:#17232a;border:1px solid #2b3e46;border-radius:15px;padding:15px}.stat small,.muted{color:#91a7aa;font-size:12px}.stat strong{display:block;margin-top:7px;font-size:17px}.card{margin-top:12px}h2{font-size:19px;margin:23px 2px 12px}h3{font-size:16px;margin:0 0 9px}.line{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:9px 0}.line span:last-child{text-align:right}.tag{font-size:11px;color:#a7dfc4;background:#23483b;padding:5px 8px;border-radius:20px}.warn{color:#ffd493;background:#574124}.danger{color:#ffc0b8;background:#563331}.btn{border:0;border-radius:10px;padding:12px 14px;background:#a9ddc2;color:#11241d;font-weight:750}.btn.secondary{background:#30454b;color:#e7f1ed}.btn:disabled{opacity:.4}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1}.tabs{position:fixed;bottom:0;left:0;right:0;background:#152027f7;border-top:1px solid #34434a;display:flex;justify-content:space-around;padding:9px 2px calc(9px + env(safe-area-inset-bottom));z-index:6}.tabs button{border:0;background:none;color:#91a8aa;font-size:11px;padding:7px 3px;min-width:17%}.tabs button.active{color:#b4f1cf;font-weight:800}.tabs .ico{display:block;font-size:19px;margin-bottom:4px}select,input[type=number]{width:100%;background:#0e191f;color:white;border:1px solid #46606a;border-radius:9px;padding:11px;margin-top:6px}label{font-size:13px;color:#c7d6d5;display:block;margin:12px 0}.banner{padding:19px;border-radius:15px;background:linear-gradient(120deg,#254c43,#152a33);margin-bottom:14px}.banner h1{font-size:23px;margin:0 0 8px}.banner p{font-size:13px;color:#d3e2dd;margin:0;line-height:1.6}.log{background:#0b171c;border-radius:11px;padding:12px;font-size:13px;line-height:1.6;margin:8px 0;border-left:3px solid #5d9b8a}.log small{color:#8daaa7;display:block}.map{height:210px;position:relative;border:1px solid #547169;background:repeating-linear-gradient(0deg,transparent,transparent 29px,#45625a40 30px),repeating-linear-gradient(90deg,#20352e,#20352e 29px,#45625a40 30px);border-radius:12px;overflow:hidden}.building{position:absolute;background:#61726b;border:2px solid #8da99c}.dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#a2f1b7;box-shadow:0 0 8px #a2f1b7}.marker{position:absolute;font-size:10px;color:#a2f1b7}.empty{color:#90a7a8;font-size:13px;line-height:1.7}.sep{height:1px;background:#34454b;margin:13px 0}.hidden{display:none}footer{font-size:11px;color:#758e91;text-align:center;margin-top:25px}
.profile-backdrop{position:fixed;inset:0;background:#071014dd;z-index:30;display:flex;align-items:flex-end;justify-content:center}.profile-sheet{width:100%;max-width:700px;max-height:94dvh;overflow:auto;background:#142129;border:1px solid #36505a;border-radius:24px 24px 0 0;padding:20px 17px calc(25px + env(safe-area-inset-bottom))}.profile-head{display:flex;gap:15px;align-items:center}.avatar{width:74px;height:82px;border-radius:14px;background:linear-gradient(145deg,#37544e,#1b313b);display:grid;place-items:center;font-size:26px;font-weight:800;color:#c8f5df}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.profile-grid>div{padding:11px;border-radius:10px;background:#1c3038}.profile-grid small{display:block;color:#9db1b5;font-size:11px;margin-bottom:6px}.profile-grid b{font-size:13px}.profile-section{margin-top:18px}.profile-section h3{border-bottom:1px solid #37505a;padding-bottom:9px}.person-click{cursor:pointer}.person-click:active{border-color:#9bdfb7}.profile-close{float:right;background:#30424b;color:white;border:0;border-radius:10px;padding:8px 12px}</style></head><body><header><b>BLACKLINE <span style="color:#9bdfb7">PMC</span></b><small>PRIVATE MILITARY COMPANY · COMMAND CENTER</small></header><main id="app"></main><nav class="tabs" id="tabs"></nav><div id="profile-root"></div><script>
const KEY='blackline_pmc_v1';const starter={day:1,cash:850000000,reputation:50,ammo:2200,med:14,gear:8,team:[],candidates:[{id:1,name:'김태훈',country:'대한민국',unit:'707특수임무단',rank:'상사',role:'팀장',skill:85,salary:90000000},{id:2,name:'James Walker',country:'미국',unit:'U.S. Army Special Forces',rank:'중사(환산)',role:'정찰',skill:81,salary:115000000},{id:3,name:'Oliver Reed',country:'영국',unit:'SAS (경력 주장)',rank:'상사(환산)',role:'통신',skill:77,salary:120000000},{id:4,name:'박준서',country:'대한민국',unit:'해군 특수전전단',rank:'중사',role:'의무',skill:79,salary:85000000},{id:5,name:'Marek Nowak',country:'폴란드',unit:'JW GROM',rank:'중사(환산)',role:'지원',skill:82,salary:100000000},{id:6,name:'Lucas Martin',country:'프랑스',unit:'Commandos Marine',rank:'중사(환산)',role:'정찰',skill:75,salary:88000000}],missions:[{id:1,title:'외교관 호송',client:'라비엔 공화국 외교부',reward:170000000,risk:1,description:'분쟁 지역 내 외교관의 안전한 이동을 지원한다.'},{id:2,title:'민간인 구출',client:'국제인도지원기구',reward:280000000,risk:2,description:'고립된 민간인을 안전지대로 이송한다.'},{id:3,title:'시설 경비',client:'노르덴 에너지',reward:125000000,risk:1,description:'연구시설의 보안과 현장 인력 보호를 맡는다.'}],history:[],pending:null};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(starter)}catch(e){state=structuredClone(starter)}let tab='home',replayIndex=0;let selectedProfile=null;const money=n=>Math.round(n).toLocaleString('ko-KR')+'원';const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const app=document.getElementById('app');const btn=(t,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${t}</button>`;function render(){document.getElementById('tabs').innerHTML=[['home','⌂','본부'],['people','♟','인사'],['logistics','▣','군수'],['missions','◈','임무'],['history','◷','기록']].map(([id,ico,n])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${n}</button>`).join('');app.innerHTML=({home,people,logistics,missions,history})[tab]();renderProfile();}function go(t){tab=t;render();window.scrollTo(0,0)}function nextDay(){state.day++;const cost=state.team.reduce((a,p)=>a+p.salary/365,0);state.cash-=Math.round(cost);save();render()}function home(){return `<div class="banner"><h1>BLACKLINE OPERATIONS</h1><p>가상의 세계에서 다국적 PMC를 운영하세요. 용병과 계약하고 팀장에게 작전을 맡긴 뒤, 승인된 지원 범위 안에서 수행된 임무를 기록으로 확인합니다.</p></div><div class="stats"><div class="stat"><small>운영일</small><strong>DAY ${state.day}</strong></div><div class="stat"><small>회사 자금</small><strong>${(state.cash/100000000).toFixed(2)}억</strong></div><div class="stat"><small>평판</small><strong>${state.reputation}/100</strong></div></div><h2>운영 현황</h2><div class="card"><div class="line"><span>계약 용병</span><strong>${state.team.length}명</strong></div><div class="line"><span>보유 탄약</span><strong>${state.ammo.toLocaleString()}발</strong></div><div class="line"><span>의료 키트</span><strong>${state.med}개</strong></div><div class="line"><span>완료 임무</span><strong>${state.history.length}건</strong></div><div class="btnrow">${btn('하루 진행','nextDay()')}${btn('임무 확인',"go('missions')",'secondary')}</div></div><div class="card"><h3>작전 운영 원칙</h3><p class="empty">현장 지휘는 AI 팀장이 담당합니다. 플레이어는 용병 채용, 군수 예산, 임무 승인과 지원 한도를 결정합니다. 작전은 자동 계산되며 종료 후 무전과 드론 기록을 재생할 수 있습니다.</p></div>`}function people(){return `<h2>용병 인력시장</h2><p class="empty">실제 특수부대 명칭을 사용하는 가상의 인물들입니다. 표기된 경력은 게임 세계 내 설정이며 실제 인물과 무관합니다.</p>${state.candidates.map(p=>`<div class="card person-click" onclick="openProfile(${p.id},false)"><div class="line"><h3>${escapeHTML(p.name)}</h3><span class="tag">${escapeHTML(p.country)}</span></div><div class="muted">${escapeHTML(p.unit)} · ${escapeHTML(p.rank)}</div><div class="line"><span>추천 보직: ${escapeHTML(p.role)}</span><span>연봉 ${money(p.salary)}</span></div><div class="line"><span class="muted">스카우트 평가</span><strong>${p.skill>=82?'우수':p.skill>=78?'양호':'성장 가능'}</strong></div>${btn('상세 정보',`openProfile(${p.id},false)`,'secondary')}${btn('1년 계약 체결',`hire(${p.id})`,state.cash<p.salary?'secondary':'')}</div>`).join('')}<h2>계약 용병 · ${state.team.length}명</h2>${state.team.length?state.team.map(p=>`<div class="card person-click" onclick="openProfile(${p.id},true)"><div class="line"><strong>${escapeHTML(p.name)}</strong><span class="tag">${state.leaderId===p.id?'팀장 · ':''}${escapeHTML(p.role)}</span></div><div class="muted">${escapeHTML(p.unit)} · ${escapeHTML(p.country)}</div><div class="line"><span>상태</span><span>${p.injured?'치료 중':'출동 가능'}</span></div></div>`).join(''):'<p class="empty">계약된 용병이 없습니다. 임무를 위해 최소 2명을 모집하세요.</p>'}`};function openProfile(id,hired){selectedProfile={id,hired};renderProfile()}function closeProfile(){selectedProfile=null;renderProfile()}function appointLeader(id){const p=state.team.find(x=>x.id===id);if(!p)return;state.leaderId=id;save();render();openProfile(id,true)}function renderProfile(){const root=document.getElementById('profile-root');if(!selectedProfile){root.innerHTML='';document.body.style.overflow='';return}const p=(selectedProfile.hired?state.team:state.candidates).find(x=>x.id===selectedProfile.id);if(!p){closeProfile();return}document.body.style.overflow='hidden';const years=4+(p.id*3)%13;const age=27+(p.id*5)%14;const verified=p.unit.includes('주장')?'본인 진술 · 확인 필요':'경력 서류 확인';const disposition=['침착하고 절차를 중시함','신속한 판단과 현장 적응력이 강점','신중하며 팀원 안전을 우선함','협업과 소통에 강점','책임감이 강하고 독립적인 성향','상황 변화에 유연하게 대응함'][((p.id-1)%6)];const initials=p.name.split(' ').length>1?p.name.split(' ').map(x=>x[0]).join(''):p.name.slice(0,1);const leader=state.leaderId===p.id;root.innerHTML=`<div class="profile-backdrop" onclick="if(event.target===this)closeProfile()"><section class="profile-sheet" role="dialog" aria-modal="true" aria-label="용병 상세 정보"><button class="profile-close" onclick="closeProfile()">✕ 닫기</button><div class="muted" style="margin:8px 0 15px">PERSONNEL DOSSIER · BL-${String(p.id).padStart(4,'0')}</div><div class="profile-head"><div class="avatar">${escapeHTML(initials)}</div><div><h2 style="margin:0 0 7px">${escapeHTML(p.name)}</h2><div class="muted">${escapeHTML(p.country)} · ${escapeHTML(p.rank)}</div><div style="margin-top:9px"><span class="tag">${selectedProfile.hired?(p.injured?'치료 중':'계약 중'):'영입 가능'}</span> ${leader?'<span class="tag">팀장</span>':''}</div></div></div><div class="profile-grid"><div><small>나이</small><b>${age}세</b></div><div><small>군 복무 경력</small><b>${years}년</b></div><div><small>추천 전문분야</small><b>${escapeHTML(p.role)}</b></div><div><small>경력 검증</small><b>${verified}</b></div><div><small>계약 연봉</small><b>${money(p.salary)}</b></div><div><small>계약 상태</small><b>${selectedProfile.hired?'1년 계약':'협상 전'}</b></div></div><div class="profile-section"><h3>군 경력</h3><p class="empty">이전 소속: ${escapeHTML(p.unit)}<br>최종 계급: ${escapeHTML(p.rank)}<br>복무 기간: ${years}년 (게임 내 생성 설정)</p></div><div class="profile-section"><h3>인물 평가</h3><p class="empty">${disposition}. ${p.skill>=82?'풍부한 현장 경험을 바탕으로 안정적인 판단을 기대할 수 있음.':p.skill>=78?'실무 경험이 있으며 지속적인 훈련으로 발전 가능.':'특정 분야에 장점이 있으며 추가 훈련이 권장됨.'} 스카우트 평가이며 실제 작전 성과를 보장하지 않습니다.</p></div><div class="profile-section"><h3>의료 및 작전 기록</h3><p class="empty">현재 상태: ${p.injured?'부상 · 치료 중':'특이사항 없음'}<br>회사 참여 작전: ${state.history.filter(h=>h.team.includes(p.name)).length}회<br>회사 내 부상 이력: ${state.history.filter(h=>h.team.includes(p.name)&&h.injury).length}건 (팀 전체 발생 기록)</p></div><div class="profile-section"><h3>인사 관리</h3><div class="btnrow">${selectedProfile.hired?(leader?'<span class="tag">현 팀장</span>':btn('팀장 임명',`appointLeader(${p.id})`)):(btn('1년 계약 체결',`hire(${p.id});closeProfile()`))}</div></div><p class="empty">모든 인물·연령·복무 이력·평가는 가상의 게임 데이터입니다. 세부 경력 및 개인별 부상 이력은 후속 버전에서 확장됩니다.</p></section></div>`}
function hire(id){const p=state.candidates.find(p=>p.id===id);if(!p)return;if(state.cash<p.salary){alert('계약 예산이 부족합니다.');return}state.cash-=p.salary;state.team.push({...p,injured:false});if(!state.leaderId)state.leaderId=p.id;state.candidates=state.candidates.filter(x=>x.id!==id);save();render()}function logistics(){return `<h2>군수본부</h2><div class="card"><h3>현재 보급 재고</h3><div class="line"><span>5.56×45mm 탄약</span><strong>${state.ammo.toLocaleString()}발</strong></div><div class="line"><span>응급 의료 키트</span><strong>${state.med}개</strong></div><div class="line"><span>개인 보호장비 세트</span><strong>${state.gear}세트</strong></div></div><h2>구매 결재</h2>${[['ammo','5.56×45mm 탄약 · 1,000발',950000],['med','의료 키트 · 5개',750000],['gear','보호장비 세트 · 2개',8000000]].map(([id,name,price])=>`<div class="card"><h3>${name}</h3><div class="line"><span class="muted">게임 내 가상 견적</span><strong>${money(price)}</strong></div>${btn('구매 승인',`buy('${id}',${price})`)}</div>`).join('')}<p class="empty">첫 버전은 품목별 재고를 관리합니다. 실제 모델별 총기 자산·공급계약·정비 이력은 후속 버전에서 세분화합니다.</p>`}function buy(id,price){if(state.cash<price){alert('자금이 부족합니다.');return}state.cash-=price;state[id]+={ammo:1000,med:5,gear:2}[id];save();render()}function missions(){if(state.pending)return approval();return `<h2>사령부 · 의뢰 접수</h2><p class="empty">작전을 승인하면 팀장 AI가 자율적으로 임무를 수행합니다. 승인서에서 지원 예산과 공중·포병 지원 제한을 설정할 수 있습니다.</p>${state.missions.map(m=>`<div class="card"><div class="line"><h3>${m.title}</h3><span class="tag ${m.risk>1?'warn':''}">${m.risk>1?'위험 높음':'위험 보통'}</span></div><div class="muted">의뢰기관: ${m.client}</div><p style="font-size:13px;line-height:1.6">${m.description}</p><div class="line"><span>계약 보수</span><strong>${money(m.reward)}</strong></div>${btn('작전 승인 검토',`prepare(${m.id})`)}</div>`).join('')}`}function prepare(id){if(state.team.filter(p=>!p.injured).length<2){alert('출동 가능한 용병이 최소 2명 필요합니다.');return}state.pending={id,air:'restricted',artillery:'off',budget:20000000};save();render()}function approval(){const m=state.missions.find(m=>m.id===state.pending.id);return `<h2>작전 승인서</h2><div class="card"><h3>${m.title}</h3><div class="muted">팀장 AI가 현장 지휘 및 장비 편성을 담당합니다.</div><label>공중 화력지원 제한<select id="air"><option value="off" ${state.pending.air==='off'?'selected':''}>금지</option><option value="restricted" ${state.pending.air==='restricted'?'selected':''}>조건부 허용 (안전·권한 검토)</option><option value="authorized" ${state.pending.air==='authorized'?'selected':''}>사전 승인 범위 내 허용</option></select></label><label>포병 화력지원 제한<select id="artillery"><option value="off" ${state.pending.artillery==='off'?'selected':''}>금지</option><option value="restricted" ${state.pending.artillery==='restricted'?'selected':''}>조건부 허용 (안전·권한 검토)</option><option value="authorized" ${state.pending.artillery==='authorized'?'selected':''}>사전 승인 범위 내 허용</option></select></label><label>작전 지원 예산 상한 (원)<input id="budget" type="number" min="0" max="200000000" step="1000000" value="${state.pending.budget}"></label><p class="empty">예산 승인만으로 화력 사용이 허용되지는 않습니다. 지원 권한과 민간인 보호 기준을 별도로 확인합니다. 긴급 상황은 팀장이 현장 재판단 후 기록에 남깁니다.</p><div class="btnrow">${btn('작전 승인·시뮬레이션','simulate()')}${btn('취소','cancel()','secondary')}</div></div>`}function cancel(){state.pending=null;save();render()}function simulate(){const m=state.missions.find(x=>x.id===state.pending.id);const budget=Number(document.getElementById('budget').value);if(!Number.isFinite(budget)||budget<0||budget>200000000){alert('지원 예산을 확인하세요.');return}const air=document.getElementById('air').value,artillery=document.getElementById('artillery').value;const active=state.team.filter(p=>!p.injured);if(active.length<2){alert('출동 가능 인원이 부족합니다.');return}if(state.ammo<120||state.med<1){alert('탄약 또는 의료물자가 부족합니다.');return}const avg=active.reduce((a,p)=>a+p.skill,0)/active.length;const seed=(state.day*7919+m.id*101+state.history.length*509+active.length*37)%997;const success=(seed%100)<Math.min(94,Math.max(30,60+avg*.3-m.risk*12));const injury=(seed%7===0||(!success&&seed%3===0));const used=120+seed%180;const medUsed=injury?1:0;const requested=(seed%4===0);const supportType=seed%2===0?'공중지원':'포병지원';const policy=supportType==='공중지원'?air:artillery;const supportAllowed=requested&&policy!=='off'&&budget>=12000000&&seed%5!==0;const supportCost=supportAllowed?12000000:0;const logs=[{t:0,who:'작전통제',msg:'임무 승인. 작전팀 출동을 허가한다.'},{t:34,who:'알파팀장',msg:'현장 도착. 팀원 상태 및 통신 확인 완료.'},{t:89,who:'정찰 담당',msg:'목표 지역 관측 중. 현장 정보를 팀장에게 전달합니다.'},{t:140,who:'알파팀장',msg:'현장 상황에 맞춰 팀 운영 계획을 조정합니다.'}];if(requested)logs.push({t:195,who:'알파팀장',msg:`${supportType} 지원 가능 여부를 요청합니다.`},{t:215,who:'작전통제',msg:supportAllowed?`${supportType} 지원 요청이 사전 승인 및 안전 검토를 통과했습니다.`:`${supportType} 지원 불가. 승인 제한 또는 현장 조건에 따라 다른 방안을 검토하십시오.`});if(injury)logs.push({t:264,who:'의무 담당',msg:'부상자 1명 발생. 현장 응급처치 및 후송 준비 중입니다.'});logs.push({t:340,who:'알파팀장',msg:success?'주요 임무 목표 달성. 복귀 절차를 시작합니다.':'현장 상황으로 임무 목표 달성에 실패했습니다. 안전하게 철수합니다.'},{t:390,who:'작전통제',msg:'작전 종료. 인원과 장비 상태를 확인하고 사후 보고서를 제출하십시오.'});logs.sort((a,b)=>a.t-b.t);state.ammo-=used;state.med-=medUsed;state.cash+=success?m.reward:Math.round(m.reward*.15);state.cash-=supportCost;if(injury){const injured=active[(seed%active.length)];injured.injured=true}state.reputation=Math.max(0,Math.min(100,state.reputation+(success?3:-4)));const record={id:Date.now(),title:m.title,success,injury,used,medUsed,reward:success?m.reward:Math.round(m.reward*.15),supportCost,air,artillery,budget,logs,day:state.day,team:active.map(x=>x.name)};state.history.unshift(record);state.pending=null;save();tab='history';replayIndex=0;render();alert('작전 시뮬레이션 완료. 기록 탭에서 드론 다시보기를 확인하세요.')}function history(){if(!state.history.length)return `<h2>작전 기록</h2><p class="empty">아직 완료한 작전이 없습니다. 용병을 채용하고 임무를 승인하세요.</p>`;const r=state.history[replayIndex]||state.history[0];return `<h2>작전 기록 · ${state.history.length}건</h2><label>다시 볼 작전<select onchange="replayIndex=Number(this.value);render()">${state.history.map((x,i)=>`<option value="${i}" ${i===replayIndex?'selected':''}>DAY ${x.day} · ${x.title} · ${x.success?'성공':'실패'}</option>`).join('')}</select></label><div class="card"><div class="line"><h3>${r.title}</h3><span class="tag ${r.success?'':'danger'}">${r.success?'임무 성공':'임무 실패'}</span></div><div class="map"><div class="building" style="left:10%;top:15%;width:29%;height:28%"></div><div class="building" style="left:58%;top:15%;width:30%;height:35%"></div><div class="building" style="left:36%;top:66%;width:34%;height:24%"></div>${r.team.map((_,i)=>`<div class="dot" style="left:${17+i*10}%;top:${49+(i%2)*9}%"></div>`).join('')}<div class="marker" style="top:6%;left:5%">DRONE 01 · REC</div><div class="marker" style="bottom:5%;right:5%">MISSION ARCHIVE</div></div><p class="muted">드론 전술 기록 · 사건 순서별 재생</p><input type="range" id="timeline" min="0" max="390" value="0" style="width:100%;accent-color:#a5dfc0" oninput="updateReplay()"><div class="line"><span id="time">00:00</span><span class="muted">06:30</span></div><div class="btnrow">${btn('◀ 이전 사건','jump(-1)','secondary')}${btn('다음 사건 ▶','jump(1)')}</div><div id="radio"></div></div><div class="card"><h3>사후 보고서</h3><div class="line"><span>탄약 소모</span><strong>${r.used}발</strong></div><div class="line"><span>부상자 발생</span><strong>${r.injury?'1명':'없음'}</strong></div><div class="line"><span>지원 비용</span><strong>${money(r.supportCost)}</strong></div><div class="line"><span>임무 수익</span><strong>${money(r.reward)}</strong></div><div class="line"><span>화력 제한</span><span class="muted">공중 ${r.air==='off'?'금지':'조건부/허용'} · 포병 ${r.artillery==='off'?'금지':'조건부/허용'}</span></div></div><footer>BLACKLINE PMC · LOCAL PROTOTYPE · 모든 인물과 임무는 가상입니다.</footer>`}function updateReplay(){const el=document.getElementById('timeline');if(!el)return;const t=+el.value;document.getElementById('time').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');const r=state.history[replayIndex];document.getElementById('radio').innerHTML=r.logs.filter(x=>x.t<=t).map(x=>`<div class="log"><small>${String(Math.floor(x.t/60)).padStart(2,'0')}:${String(x.t%60).padStart(2,'0')} · ${escapeHTML(x.who)}</small>${escapeHTML(x.msg)}</div>`).join('')||'<p class="empty">재생을 시작하면 무전 기록이 표시됩니다.</p>'}function jump(d){const el=document.getElementById('timeline');const t=+el.value;const times=state.history[replayIndex].logs.map(x=>x.t);el.value=d>0?(times.find(x=>x>t)??390):([0,...times.filter(x=>x<t)].at(-1)??0);updateReplay()}render();if(tab==='history')updateReplay();
</script></body></html>
