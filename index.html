function hire(id){const p=state.candidates.find(p=>p.id===id);if(!p)return;if(state.cash<Math.round(p.salary/12)){alert('최소 1개월 급여 예산이 부족합니다.');return}state.team.push({...p,injured:false,loadout:{primary:'미지급',secondary:'미지급',armor:'미지급',helmet:'미지급',radio:'미지급'}});state.reports.unshift({date:state.date,category:'인사',title:'신규 계약 체결 보고',body:p.name+' 용병의 1년 계약을 승인했습니다.'});if(!state.leaderId)state.leaderId=p.id;state.candidates=state.candidates.filter(x=>x.id!==id);save();render()}function logistics(){return `<h2>군수본부</h2><div class="card"><h3>현재 보급 재고</h3><div class="line"><span>5.56×45mm 탄약</span><strong>${state.ammo.toLocaleString()}발</strong></div><div class="line"><span>응급 의료 키트</span><strong>${state.med}개</strong></div><div class="line"><span>개인 보호장비 세트</span><strong>${state.gear}세트</strong></div></div><h2>무장 보유 현황</h2>${Object.entries(state.weapons).map(([name,qty])=>`<div class="card"><div class="line"><strong>${escapeHTML(name)}</strong><span>${qty}정 보유</span></div><div class="muted">무장 자산 구매 및 지급 관리</div>${btn('1정 구매 결재 · '+money(4500000),`buyWeapon('${name}')`)}</div>`).join('')}<h2>구매 결재</h2>${[['ammo','5.56×45mm 탄약 · 1,000발',950000],['med','의료 키트 · 5개',750000],['gear','보호장비 세트 · 2개',8000000]].map(([id,name,price])=>`<div class="card"><h3>${name}</h3><div class="line"><span class="muted">게임 내 가상 견적</span><strong>${money(price)}</strong></div>${btn('구매 승인',`buy('${id}',${price})`)}</div>`).join('')}<p class="empty">무장 재고는 구매 시 증가하며 인원에게 지급하면 감소합니다. 개별 정비 이력은 후속 버전에서 도입합니다.</p>`}function buy(id,price){if(state.cash<price){alert('자금이 부족합니다.');return}state.cash-=price;state[id]+={ammo:1000,med:5,gear:2}[id];state.reports.unshift({date:state.date,category:'군수',title:'군수 구매 승인 보고',body:'보급품 구매와 재고 반영을 완료했습니다.',amount:-price});save();render()}function buyWeapon(name){if(!Object.hasOwn(state.weapons,name))return;const price=4500000;if(state.cash<price){alert('자금이 부족합니다.');return}state.cash-=price;state.weapons[name]++;state.reports.unshift({date:state.date,category:'군수',title:'무장 자산 구매 보고',body:name+' 1정 구매가 승인되어 창고에 입고되었습니다.',amount:-price});save();render()}function issueWeapon(id,name){const p=state.team.find(x=>x.id===id);if(!p||p.dead||!Object.hasOwn(state.weapons,name)||state.weapons[name]<1){alert('지급할 재고가 없습니다.');return}p.loadout=p.loadout||{};if(p.loadout.primary&&p.loadout.primary!=='미지급'){state.weapons[p.loadout.primary]=(state.weapons[p.loadout.primary]||0)+1}state.weapons[name]--;p.loadout.primary=name;state.reports.unshift({date:state.date,category:'군수',title:'개인 무장 지급 보고',body:p.name+' 용병에게 '+name+' 1정을 지급했습니다.'});save();render();renderProfile()}function issueProtection(id){const p=state.team.find(x=>x.id===id);if(!p||p.dead||state.gear<1){alert('보호장비 재고가 없습니다.');return}p.loadout=p.loadout||{};if(p.loadout.armor&&p.loadout.armor!=='미지급'){alert('이미 보호장비가 지급되어 있습니다.');return}state.gear--;p.loadout.armor='방탄 보호장비 세트';state.reports.unshift({date:state.date,category:'군수',title:'보호장비 지급 보고',body:p.name+' 용병에게 보호장비 세트를 지급했습니다.'});save();render();renderProfile()}function missions(){if(state.pending)return approval();return `<h2>사령부 · 의뢰 접수</h2><p class="empty">작전을 승인하면 팀장 AI가 자율적으로 임무를 수행합니다. 승인서에서 지원 예산과 공중·포병 지원 제한을 설정할 수 있습니다.</p>${state.missions.map(m=>`<div class="card"><div class="line"><h3>${m.title}</h3><span class="tag ${m.risk>1?'warn':''}">${m.risk>1?'위험 높음':'위험 보통'}</span></div><div class="muted">의뢰기관: ${m.client} · ${m.type||'일반 계약'}</div><div class="muted">접수 ${m.receivedDate||state.date} · 제안 마감 ${m.expiresDate||'별도 협의'} · ${m.marketReason||'계약 제안'}</div><p style="font-size:13px;line-height:1.6">${m.description}</p><div class="line"><span>계약 보수</span><strong>${money(m.reward)}</strong></div>${btn('작전 승인 검토',`prepare(${m.id})`)}</div>`).join('')}`}function prepare(id){if(state.team.filter(p=>!p.injured).length<2){alert('출동 가능한 용병이 최소 2명 필요합니다.');return}state.pending={id,air:'restricted',artillery:'off',budget:20000000};save();render()}function approval(){const m=state.missions.find(m=>m.id===state.pending.id);return `<h2>작전 승인서</h2><div class="card"><h3>${m.title}</h3><div class="muted">팀장 AI가 현장 지휘 및 장비 편성을 담당합니다.</div><label>공중 화력지원 제한<select id="air"><option value="off" ${state.pending.air==='off'?'selected':''}>금지</option><option value="restricted" ${state.pending.air==='restricted'?'selected':''}>조건부 허용 (안전·권한 검토)</option><option value="authorized" ${state.pending.air==='authorized'?'selected':''}>사전 승인 범위 내 허용</option></select></label><label>포병 화력지원 제한<select id="artillery"><option value="off" ${state.pending.artillery==='off'?'selected':''}>금지</option><option value="restricted" ${state.pending.artillery==='restricted'?'selected':''}>조건부 허용 (안전·권한 검토)</option><option value="authorized" ${state.pending.artillery==='authorized'?'selected':''}>사전 승인 범위 내 허용</option></select></label><label>작전 지원 예산 상한 (원)<input id="budget" type="number" min="0" max="200000000" step="1000000" value="${state.pending.budget}"></label><p class="empty">예산 승인만으로 화력 사용이 허용되지는 않습니다. 지원 권한과 민간인 보호 기준을 별도로 확인합니다. 긴급 상황은 팀장이 현장 재판단 후 기록에 남깁니다.</p><div class="btnrow">${btn('작전 승인·시뮬레이션','simulate()')}${btn('취소','cancel()','secondary')}</div></div>`}function cancel(){state.pending=null;save();render()}function simulate(){const m=state.missions.find(x=>x.id===state.pending.id);const budget=Number(document.getElementById('budget').value);if(!Number.isFinite(budget)||budget<0||budget>200000000){alert('지원 예산을 확인하세요.');return}const air=document.getElementById('air').value,artillery=document.getElementById('artillery').value;const active=state.team.filter(p=>!p.injured);if(active.length<2){alert('출동 가능 인원이 부족합니다.');return}if(state.ammo<120||state.med<1){alert('탄약 또는 의료물자가 부족합니다.');return}const avg=active.reduce((a,p)=>a+p.skill,0)/active.length;const seed=(state.day*7919+m.id*101+state.history.length*509+active.length*37)%997;const success=(seed%100)<Math.min(94,Math.max(30,60+avg*.3-m.risk*12));const injury=(seed%7===0||(!success&&seed%3===0));const used=120+seed%180;const medUsed=injury?1:0;const requested=(seed%4===0);const supportType=seed%2===0?'공중지원':'포병지원';const policy=supportType==='공중지원'?air:artillery;const supportAllowed=requested&&policy!=='off'&&budget>=12000000&&seed%5!==0;const supportCost=supportAllowed?12000000:0;const logs=[{t:0,who:'작전통제',msg:'임무 승인. 작전팀 출동을 허가한다.'},{t:34,who:'알파팀장',msg:'현장 도착. 팀원 상태 및 통신 확인 완료.'},{t:89,who:'정찰 담당',msg:'목표 지역 관측 중. 현장 정보를 팀장에게 전달합니다.'},{t:140,who:'알파팀장',msg:'현장 상황에 맞춰 팀 운영 계획을 조정합니다.'}];if(requested)logs.push({t:195,who:'알파팀장',msg:`${supportType} 지원 가능 여부를 요청합니다.`},{t:215,who:'작전통제',msg:supportAllowed?`${supportType} 지원 요청이 사전 승인 및 안전 검토를 통과했습니다.`:`${supportType} 지원 불가. 승인 제한 또는 현장 조건에 따라 다른 방안을 검토하십시오.`});if(injury)logs.push({t:264,who:'의무 담당',msg:'부상자 1명 발생. 현장 응급처치 및 후송 준비 중입니다.'});logs.push({t:340,who:'알파팀장',msg:success?'주요 임무 목표 달성. 복귀 절차를 시작합니다.':'현장 상황으로 임무 목표 달성에 실패했습니다. 안전하게 철수합니다.'},{t:390,who:'작전통제',msg:'작전 종료. 인원과 장비 상태를 확인하고 사후 보고서를 제출하십시오.'});logs.sort((a,b)=>a.t-b.t);state.ammo-=used;state.med-=medUsed;state.cash+=success?m.reward:Math.round(m.reward*.15);state.cash-=supportCost;if(injury){const injured=active[(seed%active.length)];injured.injured=true}state.reputation=Math.max(0,Math.min(100,state.reputation+(success?3:-4)));const record={id:Date.now(),date:state.date,title:m.title,success,injury,used,medUsed,reward:success?m.reward:Math.round(m.reward*.15),supportCost,air,artillery,budget,logs,day:state.day,team:active.map(x=>x.name)};state.history.unshift(record);state.reports.unshift({date:state.date,category:'작전',title:'작전 종료 보고 · '+m.title,body:(success?'계약 목표를 달성했습니다.':'작전 목표를 달성하지 못했습니다.')+(injury?' 부상자 발생으로 의료 지원이 필요합니다.':' 인원 피해 보고는 없습니다.'),amount:(success?m.reward:Math.round(m.reward*.15))-supportCost});state.pending=null;save();tab='history';replayIndex=0;render();alert('작전 시뮬레이션 완료. 기록 탭에서 드론 다시보기를 확인하세요.')}function history(){if(!state.history.length)return `<h2>작전 기록</h2><p class="empty">아직 완료한 작전이 없습니다. 용병을 채용하고 임무를 승인하세요.</p>`;const r=state.history[replayIndex]||state.history[0];return `<h2>작전 기록 · ${state.history.length}건</h2><label>다시 볼 작전<select onchange="replayIndex=Number(this.value);render()">${state.history.map((x,i)=>`<option value="${i}" ${i===replayIndex?'selected':''}>${x.date||'DAY '+x.day} · ${x.title} · ${x.success?'성공':'실패'}</option>`).join('')}</select></label><div class="card"><div class="line"><h3>${r.title}</h3><span class="tag ${r.success?'':'danger'}">${r.success?'임무 성공':'임무 실패'}</span></div><div class="map"><div class="building" style="left:10%;top:15%;width:29%;height:28%"></div><div class="building" style="left:58%;top:15%;width:30%;height:35%"></div><div class="building" style="left:36%;top:66%;width:34%;height:24%"></div>${r.team.map((_,i)=>`<div class="dot" style="left:${17+i*10}%;top:${49+(i%2)*9}%"></div>`).join('')}<div class="marker" style="top:6%;left:5%">DRONE 01 · REC</div><div class="marker" style="bottom:5%;right:5%">MISSION ARCHIVE</div></div><p class="muted">드론 전술 기록 · 사건 순서별 재생</p><input type="range" id="timeline" min="0" max="390" value="0" style="width:100%;accent-color:#a5dfc0" oninput="updateReplay()"><div class="line"><span id="time">00:00</span><span class="muted">06:30</span></div><div class="btnrow">${btn('◀ 이전 사건','jump(-1)','secondary')}${btn('다음 사건 ▶','jump(1)')}</div><div id="radio"></div></div><div class="card"><h3>사후 보고서</h3><div class="line"><span>탄약 소모</span><strong>${r.used}발</strong></div><div class="line"><span>부상자 발생</span><strong>${r.injury?'1명':'없음'}</strong></div><div class="line"><span>지원 비용</span><strong>${money(r.supportCost)}</strong></div><div class="line"><span>임무 수익</span><strong>${money(r.reward)}</strong></div><div class="line"><span>화력 제한</span><span class="muted">공중 ${r.air==='off'?'금지':'조건부/허용'} · 포병 ${r.artillery==='off'?'금지':'조건부/허용'}</span></div></div><footer>BLACKLINE PMC · LOCAL PROTOTYPE · 모든 인물과 임무는 가상입니다.</footer>`}function updateReplay(){const el=document.getElementById('timeline');if(!el)return;const t=+el.value;document.getElementById('time').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');const r=state.history[replayIndex];document.getElementById('radio').innerHTML=r.logs.filter(x=>x.t<=t).map(x=>`<div class="log"><small>${String(Math.floor(x.t/60)).padStart(2,'0')}:${String(x.t%60).padStart(2,'0')} · ${escapeHTML(x.who)}</small>${escapeHTML(x.msg)}</div>`).join('')||'<p class="empty">재생을 시작하면 무전 기록이 표시됩니다.</p>'}function jump(d){const el=document.getElementById('timeline');const t=+el.value;const times=state.history[replayIndex].logs.map(x=>x.t);el.value=d>0?(times.find(x=>x>t)??390):([0,...times.filter(x=>x<t)].at(-1)??0);updateReplay()}render();if(tab==='history')updateReplay();
</script><script src="profile.js?v=10"></script><script src="contract-world.js?v=2026110935"></script><script src="field-simulation.js?v=2026110935"></script><script src="field-maps.js?v=2026110935"></script><script src="field-roles.js?v=2026110935"></script><script src="field-tactics.js?v=2026110935"></script><script src="field-comms.js?v=2026110935"></script><script src="field-journey.js?v=2026110935"></script><script src="operations.js?v=2026110935"></script><script src="personnel-lifecycle.js?v=1"></script><script src="hr-autonomy.js?v=2026110935"></script><script src="command-chain.js?v=1"></script><script src="specialists.js?v=3"></script><script src="medical-fatigue.js?v=2"></script><script async src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script><script src="ops-3d.js?v=2026110930"></script><script src="live-observation.js?v=4"></script><script src="armory-policy.js?v=5"></script><script src="spectator-company.js?v=2026110935"></script><script src="report-inbox.js?v=2026110935"></script><script src="result-replay.js?v=1"></script><script src="update-check.js?v=2026110935"></script><script src="start-screen.js?v=2026110935"></script><script src="field-art.js?v=2026110935"></script><script src="field-journey-view.js?v=2026110935"></script><script src="field-observation.js?v=2026110935"></script><script src="executive-ui.js?v=2026110935"></script><script src="simulation-clock.js?v=2026110935"></script></body></html>
